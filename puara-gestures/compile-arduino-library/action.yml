name: 'compile-arduino-library'
description: 'compiles the different templates to make sure they work'

# TODO: use a build matrix instead of hardcoding the combinatorial explosion.

runs:
  using: "composite"
  steps:
    - name: Download puara-gestures-arduino artifact
      uses: actions/download-artifact@v4
      with:
        name: puara-gestures-arduino

    - name: Install Arduino CLI
      shell: bash
      run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH="$PWD/bin:$PATH"
          echo "$PWD/bin" >> $GITHUB_PATH
          arduino-cli version
          arduino-cli config init
          arduino-cli core update-index

    # Install Board Cores
    - name: Install ESP32 Core
      shell: bash
      run: |
        arduino-cli core install esp32:esp32

    # Install Library Dependencies
    - name: Install Library Dependencies
      shell: bash
      run: |
        arduino-cli lib list
        arduino-cli lib install "Eigen" "boost-embedded-190"
        mkdir -p "$HOME/Arduino/libraries"
        rm -rf "$HOME/Arduino/libraries/puara"
        ln -s "$PWD/puara-gestures-arduino" "$HOME/Arduino/libraries/puara"

    # Compile Example Sketches for TinyPICO
    - name: Compile for TinyPICO
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        mapfile -t sketches < <(find examples -type f -name '*.ino' | sort)

        if [[ ${#sketches[@]} -eq 0 ]]; then
          echo "No sketches found in examples"
          exit 1
        fi

        for sketch in "${sketches[@]}"; do
          sketch_dir=$(dirname "$sketch")
          sketch_name=$(basename "$sketch" .ino)

          if [[ $(basename "$sketch_dir") == "$sketch_name" ]]; then
            compile_target="$sketch_dir"
          else
            compile_target=$(mktemp -d)
            mkdir -p "$compile_target/$sketch_name"
            cp "$sketch" "$compile_target/$sketch_name/$sketch_name.ino"
            compile_target="$compile_target/$sketch_name"
          fi

          echo "Compiling $sketch -> $compile_target"
          arduino-cli compile --fqbn esp32:esp32:um_tinypico \
            --build-property build.partitions=min_spiffs \
            --build-property upload.maximum_size=1966080 \
            --build-property compiler.cpp.extra_flags='-I$PWD/puara-gestures-arduino/src' \
            --build-property compiler.c.extra_flags='-I$PWD/puara-gestures-arduino/src' \
            --libraries "$PWD/puara-gestures-arduino" \
            "$compile_target"
        done

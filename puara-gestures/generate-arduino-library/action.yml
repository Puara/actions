name: 'generate-puara-gesturesarduino-library'
description: 'generate puara-gestures-arduino from puara-gestures'

inputs:
  puara-arduino-repo-token:
    description: 'token used to access the arduino repo'
    required: true

runs:
  using: "composite"
  steps:

    - uses: actions/checkout@v4
      with:
        repository: puara/puara-gestures
        path: puara-gestures

    - uses: actions/checkout@v4
      with:
        token: ${{ inputs.puara-arduino-repo-token }}
        repository: puara/puara-gestures-arduino
        path: puara-gestures-arduino

    - uses: actions/checkout@v4
      with:
        repository: malloch/IMU_Sensor_Fusion
        path: IMU_Sensor_Fusion

    - name: Generate puara-gestures-arduino repo
      shell: bash
      run: |
        PUARA_GESTURES_SOURCES=(
          src include examples/arduino library.properties
          LICENSE README.md
        )

        # 1. Recreate repo
        (
          cd puara-gestures-arduino || exit 1

          git config user.name "puara-bot"
          git config user.email "puara-bot@sat.qc.ca"

          git checkout -b continuous
        #  rm -rf "${PUARA_GESTURES_SOURCES[@]}" examples
          mkdir -p examples 
          mkdir -p src
        )
        # 2. Copy puara-gestures sources to puara-gestures-arduino
        (
          cd puara-gestures || exit 1
          cp -rf examples/arduino/* ../puara-gestures-arduino/examples/
          cp -rf src/* ../puara-gestures-arduino/src/
          cp -rf include/* ../puara-gestures-arduino/src/
          cp library.properties ../puara-gestures-arduino/
          cp LICENSE ../puara-gestures-arduino/
          cp README.md ../puara-gestures-arduino/)

        # 3. Copy IMU_Sensor_Fusion files into src/IMU_Sensor_Fusion/
        mkdir -p puara-gestures-arduino/src/IMU_Sensor_Fusion
        cp IMU_Sensor_Fusion/imu_orientation.h \
           IMU_Sensor_Fusion/imu_orientation.cpp \
           puara-gestures-arduino/src/IMU_Sensor_Fusion/


    - name: Upload puara-gesturesarduino artifact
      uses: actions/upload-artifact@v4
      with:
          name: puara-gestures-arduino
          path: puara-gestures-arduino
